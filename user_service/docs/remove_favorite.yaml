Удаляет криптовалюту из избранного пользователя
---
tags:
  - Favorites
parameters:
  - name: user_id
    in: path
    type: integer
    required: true
    description: ID пользователя
    example: 123456789
  - name: body
    in: body
    required: true
    description: Символ криптовалюты для удаления
    schema:
      type: object
      required:
        - crypto_symbol
      properties:
        crypto_symbol:
          type: string
          description: Символ криптовалюты (например, BTC)
          example: "BTC"
responses:
  200:
    description: Успешное удаление из избранного
    schema:
      type: object
      properties:
        data:
          type: object
          properties:
            success:
              type: boolean
              description: Флаг успешного выполнения
              example: true
            user_id:
              type: integer
              description: ID пользователя
              example: 123456789
            crypto_symbol:
              type: string
              description: Символ удаленной криптовалюты
              example: "BTC"
            action:
              type: string
              description: Тип выполненного действия
              example: "removed_from_favorites"
  400:
    description: Неверный запрос
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: ValidationError
              message:
                type: string
                example: "Missing required field: crypto_symbol"
  404:
    description: Криптовалюта не найдена в избранном или пользователь не существует
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: NotFound
              message:
                type: string
                example: "Favorite not found or user does not exist"
  500:
    description: Ошибка сервера
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: InternalServerError
              message:
                type: string
                example: "Failed to remove favorite crypto"
