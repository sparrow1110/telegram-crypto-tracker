Добавляет криптовалюту в избранное пользователя
---
tags:
  - Favorites
parameters:
  - name: user_id
    in: path
    type: integer
    required: true
    example: 123456789
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - crypto_symbol
      properties:
        crypto_symbol:
          type: string
          example: "BTC"
responses:
  201:
    description: Криптовалюта добавлена в избранное
    schema:
      type: object
      properties:
        data:
          type: object
          properties:
            user_id:
              type: integer
              example: 123456789
            crypto_symbol:
              type: string
              example: "BTC"
  400:
    description: Криптовалюта уже в избранном
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: AlreadyExists
              message:
                type: string
                example: "Crypto already in favorites"
  404:
    description: Пользователь не найден
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: NotFound
              message:
                type: string
                example: "User not found"
  500:
    description: Ошибка сервера
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: InternalServerError
              message:
                type: string
                example: "Failed to add favorite"
