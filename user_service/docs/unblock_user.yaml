Разблокировка пользователя
---
tags:
  - Users
parameters:
  - name: user_id
    in: path
    type: integer
    required: true
responses:
  200:
    description: Пользователь разблокирован
    schema:
      type: object
      properties:
        data:
          type: object
          properties:
            user_id:
              type: integer
            is_blocked:
              type: boolean
            action:
              type: string
  404:
    description: Пользователь не найден
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: UserNotFound
              message:
                type: string
                example: "User 123 not found"
  500:
    description: Ошибка сервера
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: InternalServerError
              message:
                type: string
                example: "Failed to update user status"
