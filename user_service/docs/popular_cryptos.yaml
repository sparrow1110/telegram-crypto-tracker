Получает список популярных криптовалют
---
tags:
  - Stats
parameters:
  - name: limit
    in: query
    type: integer
    default: 5
    description: Количество возвращаемых криптовалют
responses:
  200:
    description: Популярные криптовалюты
    schema:
      type: object
      properties:
        data:
          type: object
          properties:
            cryptos:
              type: array
              items:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
                example: ["BTC", 150]
              example: [["SOL", 1], ["ETH", 1]]
        meta:
          type: object
          properties:
            limit:
              type: integer
              example: 5
  500:
    description: Ошибка сервера
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: InternalServerError
              message:
                type: string
                example: "Failed to get popular cryptos"
