Получает статистику бота
---
tags:
  - Stats
responses:
  200:
    description: Статистика бота
    schema:
      type: object
      properties:
        data:
          type: object
          properties:
            stats:
              type: string
              description: Форматированная статистика
  500:
    description: Ошибка сервера
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: InternalServerError
              message:
                type: string
                example: "Failed to fetch statistics"
