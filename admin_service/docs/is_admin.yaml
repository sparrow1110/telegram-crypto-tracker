Проверяет, является ли пользователь администратором
---
tags:
  - Admin
parameters:
  - name: user_id
    in: path
    type: integer
    required: true
    description: ID пользователя
responses:
  200:
    description: Результат проверки
    schema:
      type: object
      properties:
        data:
          type: object
          properties:
            is_admin:
              type: boolean
              description: Является ли пользователь администратором
  500:
    description: Ошибка сервера
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: InternalServerError
              message:
                type: string
                example: "Error connecting to database"
