Получает информацию о конкретной криптовалюте
---
tags:
  - Crypto
parameters:
  - name: symbol
    in: path
    type: string
    required: true
    description: Символ криптовалюты (например, BTC)
responses:
  200:
    description: Информация о криптовалюте
    schema:
      type: object
      properties:
        data:
          type: object
          properties:
            name:
              type: string
              example: Bitcoin
            price_usd:
              type: number
              format: float
              example: 50000.1234
            percent_change_1h:
              type: number
              format: float
              example: 0.5
            percent_change_24h:
              type: number
              format: float
              example: -2.3
            percent_change_7d:
              type: number
              format: float
              example: 5.7
            market_cap_usd:
              type: number
              format: float
              example: 950000000000
            rank:
              type: integer
              example: 1
            last_updated:
              type: string
              format: date-time
              example: "2023-05-15 12:34:56"
  404:
    description: Криптовалюта не найдена
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: NotFound
              message:
                type: string
                example: "Crypto not found"
  500:
    description: Ошибка сервера
    schema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: InternalServerError
              message:
                type: string
                example: "Failed to parse crypto data"
